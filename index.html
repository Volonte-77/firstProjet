<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet avec Tailwind</title>
    <link rel="stylesheet" href="styles.css">
    <link href="./styles.css" rel="stylesheet">
    <script defer src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script defer src="./script.js"></script>
    <script defer src="https://cdn.tailwindcss.com"></script> 
</head>
<body>
    <header class="bg-blue-500 text-white p-4">
        <h1 class="text-2xl">Bienvenue sur mon projet</h1>
    </header>
    <main class="p-4">
        <section class="mb-4">
            <h2 class="text-xl">À propos de ce projet</h2>
            <p>Ceci est un exemple de projet utilisant Tailwind CSS.</p>
        </section>
        <section>
            <h2 class="text-xl">Fonctionnalités</h2>
            <ul class="list-disc pl-5">
                <li>Utilisation de Tailwind CSS pour le style</li>
                <li>Intégration de Font Awesome pour les icônes</li>
                <li>JavaScript pour l'interactivité</li>
            </ul>
        </section>
    </main>
    <footer class="bg-gray-800 text-white p-4 text-center">
        &copy; 2023 Mon Projet
    </footer>
</body>
</html>
